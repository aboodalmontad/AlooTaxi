<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allo Taxi - ألو تكسي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- Leaflet Rotate Plugin -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-rotate/dist/leaflet.rotate.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate/dist/leaflet.rotate.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#0d9488', // teal-600
                light: '#ccfbf1',   // teal-100
                dark: '#115e59',    // teal-800
              },
              secondary: {
                DEFAULT: '#a21caf', // fuchsia-700
                light: '#f5d0fe',   // fuchsia-200
              },
              accent: '#475569', // slate-600
            }
          }
        }
      }
    </script>
    <style>
        .leaflet-container {
            height: 100%;
            width: 100%;
        }
        /* Basic transition for smoother UI interactions */
        button, a, input, select, div {
            transition: all 0.2s ease-in-out;
        }
        /* For hiding scrollbars */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        /* Pulsing animation for user location marker */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .user-location-icon {
            background-color: #3B82F6;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }
        
        /* General purpose animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-fade-in-down { animation: fadeInDown 0.3s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }

        /* Styles for 3D Navigation View */
        .navigation-view {
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        .navigation-view .leaflet-map-pane {
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: translateY(-15%) rotateX(55deg) scale(1.1);
            transform-origin: bottom center;
        }
        .navigation-view .leaflet-control-container .leaflet-bottom {
            transition: bottom 0.8s ease-out !important;
            bottom: calc(15% + 10px) !important;
        }
        /* Counter-rotate markers to make them stand upright on the tilted map */
        .navigation-view .leaflet-marker-icon:not(.navigation-arrow-icon) {
            transform: rotateX(-55deg) !important;
            transform-origin: bottom center; /* Anchored markers pivot from their base */
        }
        /* Special styling for the user's navigation arrow to make it 'float' */
        .navigation-view .navigation-arrow-icon {
            transform: rotateX(-55deg) translateY(-10px) !important;
            transform-origin: center center; /* Centered arrow pivots from its middle */
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.3));
        }
        .navigation-arrow-icon svg {
            display: block; /* Ensure SVG fits its container */
        }
    </style>
  <script type="importmap">
{
  "imports": {

  }
}
</script>
